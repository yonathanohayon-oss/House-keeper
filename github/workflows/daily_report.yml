# .github/workflows/daily_report.yml
# שולח סיכום יומי לטלגרם בכל יום בשעה 08:00 שעון ישראל
#
# שעון ישראל:
#   קיץ  (IDT = UTC+3): 05:00 UTC  = 08:00 IDT  ← הגדרה כרגע
#   חורף (IST = UTC+2): 06:00 UTC  = 08:00 IST   ← שנה ל: "0 6 * * *"

name: סיכום יומי – בית חכם

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 08:00 שעון ישראל קיץ

  # הפעלה ידנית מלשונית Actions
  workflow_dispatch:

jobs:
  send-daily-summary:
    name: שליחת סיכום יומי לטלגרם
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. שליפת הקוד ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. הגדרת Python ───────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── 3. התקנת תלויות ───────────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. הרצת סקריפט הסיכום ────────────────────────────────────────────
      - name: Send daily summary
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_summary.py

      # ── 5. הודעת כישלון לטלגרם ───────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ בית חכם: הסיכום היומי *נכשל* ב-$(date '+%Y-%m-%d'). בדוק את לוג GitHub Actions." \
            -d parse_mode="Markdown"
